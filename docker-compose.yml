# ============================================================
# Docker Compose - Medical Triage Agent
#
# Services :
# - FastAPI    : API REST
# - vLLM       : inférence Qwen3
# - Prometheus : collecte des métriques
# - Grafana    : visualisation du monitoring
#
# Démarrage progressif avec profils Docker.
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. API FASTAPI
  # ----------------------------------------------------------

  api:
    # Image publiée par la CD (API_IMAGE) ; sinon construction locale.
    image: ${API_IMAGE:-medical-triage-api:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    container_name: medical-triage-api

    # API accessible uniquement depuis l'ordinateur local.
    ports:
      - "127.0.0.1:8000:8000"

    # Configuration du moteur d'inférence.
    environment:
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-mock}
      # vLLM local (profil gpu) par défaut ; sinon URL distante, ex. RunPod :
      # https://<pod-id>-8000.proxy.runpod.net/v1
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_MODEL: triage-qwen3
      MODEL_VERSION: ${MODEL_VERSION:-qwen3-1.7b-sft154320-ckpt450-dpoaligned-ckpt200}
      # Journal d'audit : une ligne JSON par décision, sans texte patient.
      AUDIT_LOG_PATH: /app/logs/audit.jsonl

    # Journal d'audit conservé hors du conteneur.
    volumes:
      - audit_logs:/app/logs

    # Réduit les privilèges du conteneur.
    security_opt:
      - no-new-privileges:true

    # Vérifie la disponibilité de l'API.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  # ----------------------------------------------------------
  # 2. SERVEUR D'INFÉRENCE VLLM
  # ----------------------------------------------------------

  vllm:
    # Activation uniquement avec le profil GPU.
    profiles:
      - gpu

    # Version à figer après validation de compatibilité.
    # Version relevée sur RunPod le 12 octobre (mesures du test gelé).
    image: vllm/vllm-openai:v0.31.0

    container_name: medical-triage-vllm

    # Accès local pour les tests.
    ports:
      - "127.0.0.1:8001:8000"

    # Accès au GPU NVIDIA.
    gpus: all

    # Modèle fusionné (Qwen3 + LoRA SFT checkpoint-450 + DPO checkpoint-150, BF16).
    # Produit par notebooks/07_fusion_lora.ipynb.
    volumes:
      - ./artifacts/deployment/qwen3-triage-20261009-154320-aligned:/models/triage-qwen3:ro

    # Même template de conversation qu'à l'entraînement, contexte limité à 2 048 tokens.
    command:
      - --model
      - /models/triage-qwen3
      - --served-model-name
      - triage-qwen3
      - --dtype
      - bfloat16
      - --max-model-len
      - "2048"
      # RTX 4050 Laptop (6 Go) : 80 % de la VRAM pour vLLM (poids 3,3 Go + cache KV),
      # la valeur par défaut (90 %) dépasse souvent la mémoire libre sous Windows.
      - --gpu-memory-utilization
      - "0.80"
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  # ----------------------------------------------------------
  # 3. PROMETHEUS
  # ----------------------------------------------------------

  prometheus:
    profiles:
      - monitoring

    # Version à figer avant déploiement.
    image: prom/prometheus:latest

    container_name: medical-triage-prometheus

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.tpl.yml:ro
      - prometheus_data:/prometheus

    # Interface Prometheus locale.
    ports:
      - "127.0.0.1:9090:9090"

    # Cible vLLM : locale par défaut, ou pod RunPod pour la démo cloud
    # (VLLM_METRICS_SCHEME=https, VLLM_METRICS_TARGET=<pod-id>-8000.proxy.runpod.net).
    environment:
      VLLM_METRICS_SCHEME: ${VLLM_METRICS_SCHEME:-http}
      VLLM_METRICS_TARGET: ${VLLM_METRICS_TARGET:-vllm:8000}

    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__VLLM_METRICS_SCHEME__|$$VLLM_METRICS_SCHEME|"
        -e "s|__VLLM_METRICS_TARGET__|$$VLLM_METRICS_TARGET|"
        /etc/prometheus/prometheus.tpl.yml > /tmp/prometheus.yml
        && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  # ----------------------------------------------------------
  # 4. GRAFANA
  # ----------------------------------------------------------

  grafana:
    profiles:
      - monitoring

    # Version à figer avant déploiement.
    image: grafana/grafana:latest

    container_name: medical-triage-grafana

    # Interface Grafana locale.
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Définir GRAFANA_ADMIN_PASSWORD dans .env}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped


# ------------------------------------------------------------
# VOLUMES PERSISTANTS
# ------------------------------------------------------------

volumes:
  audit_logs:
  prometheus_data:
  grafana_data: