<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-label="Chaîne CI/CD GitHub Actions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="470" rx="18" fill="#111a22"/>
<text x="40.0" y="46.0" fill="#edf4f4" font-size="22" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Intégration et déploiement continus</text>
<text x="40.0" y="72.0" fill="#98a8ad" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Aucun entraînement dans la CI : elle teste le code applicatif ; la CD ne publie que si la CI a réussi</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a8ad"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#48c9b0"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2f9e8a" opacity="0.35"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2f9e8a" stroke-width="3"/></pattern></defs>
<rect x="40" y="110" width="170" height="150" rx="12" fill="#17232d" stroke="#3a4a54" stroke-width="1.5"/>
<text x="54.0" y="134.0" fill="#98a8ad" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">DÉCLENCHEUR</text>
<text x="54.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >push / PR</text>
<text x="54.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >branche main</text>
<text x="54.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >ou lancement manuel</text>
<line x1="212" y1="185" x2="248" y2="185" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="250" y="110" width="290" height="230" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="264.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">CI · UBUNTU · 15 MIN MAX</text>
<text x="264.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Quality &amp; Tests</text>
<text x="264.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >uv + Python 3.13</text>
<text x="264.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >uv sync --locked (groupe ci)</text>
<text x="264.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >ruff check</text>
<text x="264.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >ruff format --check</text>
<text x="264.0" y="252.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >pytest + couverture (scr)</text>
<text x="264.0" y="270.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >moteur forcé : mock</text>
<text x="264.0" y="288.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >permissions : lecture seule</text>
<line x1="542" y1="185" x2="578" y2="185" stroke="#48c9b0" stroke-width="1.6" marker-end="url(#arrA)"/>
<text x="560.0" y="172.0" fill="#48c9b0" font-size="11" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="700" >succès</text>
<rect x="580" y="110" width="220" height="190" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="594.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">CD · BUILD</text>
<text x="594.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Build &amp; Publish</text>
<text x="594.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >commit validé par la CI</text>
<text x="594.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Docker Buildx + cache</text>
<text x="594.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >image ghcr.io/…/api</text>
<text x="594.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >tag sha-&lt;commit&gt;</text>
<line x1="802" y1="185" x2="838" y2="185" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="840" y="110" width="200" height="190" rx="12" fill="#17232d" stroke="#cf7f3c" stroke-width="1.5"/>
<text x="854.0" y="134.0" fill="#cf7f3c" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">CD · DÉPLOIEMENT</text>
<text x="854.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Deploy Pilot</text>
<text x="854.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >environnement « pilot »</text>
<text x="854.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >SSH + compose up api</text>
<text x="854.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >healthcheck curl</text>
<text x="854.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >5 essais</text>
<rect x="40" y="370" width="1000" height="70" rx="12" fill="none" stroke="#cf7f3c" stroke-opacity="0.6"/>
<text x="58.0" y="398.0" fill="#edf4f4" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Point à corriger : le service api du docker-compose est construit localement (build) et ne lit pas la variable API_IMAGE.</text>
<text x="58.0" y="420.0" fill="#98a8ad" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Le déploiement ne récupère donc pas encore l'image publiée sur GHCR. Les secrets du serveur pilote doivent aussi être configurés.</text>
</svg>
