<text x="40.0" y="72.0" fill="#98a8ad" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Mêmes volumes pour chaque langue et chaque priorité, pour que le score ne soit pas porté par la classe majoritaire</text>
