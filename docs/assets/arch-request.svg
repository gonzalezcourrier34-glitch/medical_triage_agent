<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-label="Étapes de traitement d'une requête POST /triage" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="520" rx="18" fill="#111a22"/>
<text x="40.0" y="46.0" fill="#edf4f4" font-size="22" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Le trajet d'une requête de triage</text>
<text x="40.0" y="72.0" fill="#98a8ad" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >La décision vient du modèle ; la recommandation vient d'une règle fixe, plus sûre qu'un texte généré</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a8ad"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#48c9b0"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2f9e8a" opacity="0.35"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2f9e8a" stroke-width="3"/></pattern></defs>
<rect x="40" y="110" width="186" height="150" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="54.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">1 · REQUÊTE</text>
<text x="54.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >POST /triage</text>
<text x="54.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >language : fr | en</text>
<text x="54.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >question (obligatoire)</text>
<text x="54.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >context, answer</text>
<line x1="228" y1="185" x2="246" y2="185" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="248" y="110" width="186" height="150" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="262.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">2 · VALIDATION</text>
<text x="262.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Pydantic</text>
<text x="262.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >langue inconnue → 422</text>
<text x="262.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >question vide → 422</text>
<text x="262.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >champ inconnu → 422</text>
<line x1="436" y1="185" x2="454" y2="185" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="456" y="110" width="186" height="150" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="470.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">3 · MODÈLE</text>
<text x="470.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Scoring P1/P2/P3</text>
<text x="470.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >même prompt que le</text>
<text x="470.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >benchmark, 3 candidats</text>
<text x="470.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >log-prob moyenne</text>
<line x1="644" y1="185" x2="662" y2="185" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="664" y="110" width="186" height="150" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="678.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">4 · RÈGLE MÉTIER</text>
<text x="678.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Recommandation</text>
<text x="678.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >table fixe par priorité</text>
<text x="678.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >et par langue</text>
<text x="678.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >pas générée par le LLM</text>
<line x1="852" y1="185" x2="870" y2="185" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="872" y="110" width="186" height="150" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="886.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">5 · RÉPONSE</text>
<text x="886.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >JSON tracé</text>
<text x="886.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >request_id, timestamp</text>
<text x="886.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >model_version</text>
<text x="886.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >latency_ms</text>
<rect x="40" y="290" width="1000" height="150" rx="12" fill="#0b1117" stroke="#3a4a54"/>
<text x="64.0" y="322.0" fill="#edf4f4" font-size="14" font-family="Consolas, 'Courier New', monospace" text-anchor="start" font-weight="normal" >{ "request_id": "…", "timestamp": "…", "model_version": "…",</text>
<text x="64.0" y="346.0" fill="#48c9b0" font-size="14" font-family="Consolas, 'Courier New', monospace" text-anchor="start" font-weight="normal" >  "priority": "P1",</text>
<text x="64.0" y="370.0" fill="#edf4f4" font-size="14" font-family="Consolas, 'Courier New', monospace" text-anchor="start" font-weight="normal" >  "explanation": "…",</text>
<text x="64.0" y="394.0" fill="#48c9b0" font-size="14" font-family="Consolas, 'Courier New', monospace" text-anchor="start" font-weight="normal" >  "recommendation": "Prise en charge immédiate par une équipe médicale.",</text>
<text x="64.0" y="418.0" fill="#edf4f4" font-size="14" font-family="Consolas, 'Courier New', monospace" text-anchor="start" font-weight="normal" >  "latency_ms": …, "status": "success" }</text>
<text x="40.0" y="474.0" fill="#98a8ad" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Toutes les requêtes sont comptées par l'instrumentation Prometheus (/metrics). Les données patient ne sont jamais renvoyées dans la réponse ni exposées dans les métriques.</text>
<text x="40.0" y="496.0" fill="#6b7c83" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Vérifié par les tests test_patient_data_not_echoed et test_invalid_request_not_exposed_in_metrics.</text>
</svg>
