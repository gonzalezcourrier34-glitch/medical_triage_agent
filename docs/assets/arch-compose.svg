<text x="319.8" y="357.0" fill="#edf4f4" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="normal" >no-new-privileges</text>
<rect x="408.4" y="336" width="184" height="32" rx="16" fill="none" stroke="#3a4a54"/>
<text x="500.2" y="357.0" fill="#edf4f4" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="normal" >Utilisateur uid 10001</text>
<rect x="604.0" y="336" width="199" height="32" rx="16" fill="none" stroke="#3a4a54"/>
<text x="703.4" y="357.0" fill="#edf4f4" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="normal" >Secrets hors Git (.env)</text>
<rect x="814.8" y="336" width="184" height="32" rx="16" fill="none" stroke="#3a4a54"/>
<text x="906.6" y="357.0" fill="#edf4f4" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="normal" >Démarrage par profils</text>
<text x="40.0" y="405.0" fill="#98a8ad" font-size="12.5" font-family="Consolas, 'Courier New', monospace" text-anchor="start" font-weight="normal" >docker compose up → API seule · --profile monitoring → + Prometheus et Grafana · --profile gpu → + vLLM</text>
