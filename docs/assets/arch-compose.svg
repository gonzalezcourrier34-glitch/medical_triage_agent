<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-label="Services Docker Compose et profils" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="430" rx="18" fill="#111a22"/>
<text x="40.0" y="46.0" fill="#edf4f4" font-size="22" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Quatre services, trois profils</text>
<text x="40.0" y="72.0" fill="#98a8ad" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Je démarre seulement ce dont j'ai besoin : l'API seule pour tester, le monitoring et le GPU à la demande</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a8ad"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#48c9b0"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2f9e8a" opacity="0.35"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2f9e8a" stroke-width="3"/></pattern></defs>
<rect x="40" y="110" width="235" height="170" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="54.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">PROFIL PAR DÉFAUT</text>
<text x="54.0" y="158.0" fill="#edf4f4" font-size="20" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >api</text>
<text x="54.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >127.0.0.1:8000</text>
<text x="54.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >build docker/Dockerfile.api</text>
<text x="54.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >healthcheck /health · 30 s</text>
<text x="54.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >INFERENCE_BACKEND=mock</text>
<rect x="295" y="110" width="235" height="170" rx="12" fill="#17232d" stroke="#5d6b73" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="309.0" y="134.0" fill="#98a8ad" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">PROFIL gpu</text>
<text x="309.0" y="158.0" fill="#edf4f4" font-size="20" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >vllm</text>
<text x="309.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >127.0.0.1:8001</text>
<text x="309.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >gpus: all</text>
<text x="309.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >modèle monté en lecture seule</text>
<text x="309.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >image :latest à figer</text>
<rect x="550" y="110" width="235" height="170" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="564.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">PROFIL monitoring</text>
<text x="564.0" y="158.0" fill="#edf4f4" font-size="20" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >prometheus</text>
<text x="564.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >127.0.0.1:9090</text>
<text x="564.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >scrape toutes les 15 s</text>
<text x="564.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >api + vllm</text>
<text x="564.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >volume persistant</text>
<rect x="805" y="110" width="235" height="170" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="819.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">PROFIL monitoring</text>
<text x="819.0" y="158.0" fill="#edf4f4" font-size="20" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >grafana</text>
<text x="819.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >127.0.0.1:3000</text>
<text x="819.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >mot de passe obligatoire (.env)</text>
<text x="819.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >dashboard provisionné</text>
<text x="819.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >volume persistant</text>
<text x="40.0" y="320.0" fill="#98a8ad" font-size="11" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">SÉCURITÉ ET EXPLOITATION</text>
<rect x="40" y="336" width="191" height="32" rx="16" fill="none" stroke="#3a4a54"/>
<text x="135.6" y="357.0" fill="#edf4f4" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="normal" >Ports liés à 127.0.0.1</text>
