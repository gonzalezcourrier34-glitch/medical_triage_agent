<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-label="Mécanisme de la loss DPO pondérée" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="560" rx="18" fill="#111a22"/>
<text x="40.0" y="46.0" fill="#edf4f4" font-size="22" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Ce que mon DPO optimise vraiment</text>
<text x="40.0" y="72.0" fill="#98a8ad" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Une loss DPO pondérée, avec une référence SFT pré-calculée pour tenir dans 6 Go</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a8ad"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#48c9b0"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2f9e8a" opacity="0.35"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2f9e8a" stroke-width="3"/></pattern></defs>
<rect x="40" y="110" width="200" height="300" rx="12" fill="#17232d" stroke="#3a4a54" stroke-width="1.5"/>
<text x="54.0" y="134.0" fill="#98a8ad" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">ENTRÉE</text>
<text x="54.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Même cas clinique</text>
<text x="54.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >contexte patient</text>
<text x="54.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >prompt système FR/EN</text>
<text x="54.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >identique pour les</text>
<text x="54.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >deux réponses</text>
<text x="270.0" y="128.0" fill="#48c9b0" font-size="11" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">CHOSEN · RÉPONSE PRÉFÉRÉE</text>
<rect x="270" y="140" width="170" height="64" rx="8" fill="#17232d" stroke="#3a4a54"/>
<text x="355.0" y="168.0" fill="#edf4f4" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="700" >PRIORITY: P1</text>
<text x="355.0" y="188.0" fill="#98a8ad" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="normal" >poids 0,2</text>
<rect x="448" y="140" width="300" height="64" rx="8" fill="#17232d" stroke="#48c9b0" stroke-width="1.5"/>
<text x="462.0" y="164.0" fill="#edf4f4" font-size="13.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >EXPLANATION spécifique</text>
<text x="462.0" y="186.0" fill="#98a8ad" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >« Votre fièvre et votre toux… »</text>
<text x="740.0" y="186.0" fill="#98a8ad" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="end" font-weight="normal" >poids 1,0</text>
<text x="270.0" y="288.0" fill="#cf7f3c" font-size="11" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">REJECTED · RÉPONSE REJETÉE</text>
<rect x="270" y="300" width="170" height="64" rx="8" fill="#17232d" stroke="#3a4a54"/>
<text x="355.0" y="328.0" fill="#edf4f4" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="700" >PRIORITY: P1</text>
<text x="355.0" y="348.0" fill="#98a8ad" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="normal" >poids 0,2</text>
<rect x="448" y="300" width="300" height="64" rx="8" fill="#17232d" stroke="#cf7f3c" stroke-width="1.5"/>
<text x="462.0" y="324.0" fill="#edf4f4" font-size="13.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >EXPLANATION générique</text>
<text x="462.0" y="346.0" fill="#98a8ad" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >« The condition named in the case… »</text>
<text x="740.0" y="346.0" fill="#98a8ad" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="end" font-weight="normal" >poids 1,0</text>
<line x1="242" y1="200" x2="266" y2="172" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="242" y1="300" x2="266" y2="332" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M 355 210 V 290" stroke="#48c9b0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="368.0" y="255.0" fill="#48c9b0" font-size="11.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >identiques :</text>
<text x="368.0" y="270.0" fill="#48c9b0" font-size="11.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >s'annulent</text>
<rect x="790" y="110" width="250" height="300" rx="12" fill="#17232d" stroke="#2f9e8a" stroke-width="1.5"/>
<text x="804.0" y="134.0" fill="#48c9b0" font-size="10.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" letter-spacing="1.3">LOSS DPO</text>
<text x="804.0" y="158.0" fill="#edf4f4" font-size="16" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Préférer « chosen »</text>
<text x="804.0" y="180.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >log-prob pondérées</text>
<text x="804.0" y="198.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >chosen − rejected</text>
<text x="804.0" y="216.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >moins le même écart</text>
<text x="804.0" y="234.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >calculé par le SFT figé</text>
<text x="804.0" y="252.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" ></text>
<text x="804.0" y="270.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >loss = −log σ(β · Δ)</text>
<text x="804.0" y="288.0" fill="#98a8ad" font-size="12.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >β = 0,1</text>
<line x1="750" y1="172" x2="786" y2="220" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="750" y1="332" x2="786" y2="290" stroke="#98a8ad" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="40" y="440" width="1000" height="80" rx="12" fill="none" stroke="#48c9b0" stroke-opacity="0.6"/>
<text x="58.0" y="468.0" fill="#edf4f4" font-size="13.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="700" >Conséquence : la priorité est la même dans les deux réponses, sa contribution disparaît de la différence.</text>
<text x="58.0" y="492.0" fill="#98a8ad" font-size="13" font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="start" font-weight="normal" >Le DPO n'agit que sur l'explication. Il ne peut pas, par construction, apprendre à mieux trier.</text>
</svg>
