# ============================================================
# CD - Continuous Deployment
# Projet : Medical Triage Agent
#
# Objectif :
# Construire, publier et déployer l'API FastAPI.
# Le modèle Qwen3 est servi séparément par vLLM.
# ============================================================

name: CD

# ------------------------------------------------------------
# 1. Déclenchement après la réussite de la CI
# ------------------------------------------------------------

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

  # Autorise également un lancement manuel.
  workflow_dispatch:


# ------------------------------------------------------------
# 2. Permissions GitHub
# ------------------------------------------------------------

permissions:
  contents: read
  packages: write


# ------------------------------------------------------------
# 3. Construction et publication Docker
# ------------------------------------------------------------

jobs:

  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    # Ne pas publier si la CI a échoué.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:

      # Récupère exactement le commit validé par la CI.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Prépare Docker Buildx pour construire l'image.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authentification au registre GitHub.
      # GITHUB_TOKEN est fourni automatiquement par GitHub.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Détermine le nom et la version de l'image.
      - name: Image metadata
        id: meta
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          echo "image=ghcr.io/${REPO}/api:sha-${SHA}" >> "$GITHUB_OUTPUT"

      # Construit l'image FastAPI puis la publie.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.image }}

          # Réutilise le cache pour accélérer les builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max


# ------------------------------------------------------------
# 4. Déploiement pilote
# ------------------------------------------------------------

  # Déploiement SSH vers un serveur pilote : activé seulement si la variable
  # de dépôt DEPLOY_ENABLED vaut "true" (Settings > Variables). Pour la démo,
  # l'image publiée est lancée sur RunPod (voir deploy/runpod.md).
  deploy:
    name: Deploy Pilot
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    # Protection possible par approbation manuelle.
    environment: pilot

    runs-on: ubuntu-latest

    steps:

      # Préparation du client SSH.
      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Connexion au serveur et mise à jour de l'API.
      - name: Deploy application
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            "cd /opt/medical_triage_agent && \
             API_IMAGE='$IMAGE' docker compose pull api && \
             API_IMAGE='$IMAGE' docker compose up -d api"

      # Vérification de l'endpoint après déploiement.
      - name: Healthcheck
        shell: bash
        env:
          HEALTH_URL: ${{ secrets.PILOT_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error \
               --retry 5 \
               --retry-delay 5 \
               "$HEALTH_URL"